name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || true

      - name: Transfer backend files to EC2 temp dir
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/ubuntu/temp-backend"
          # storageやlogsなどを除外して一時ディレクトリへ転送
          rsync -avz --exclude '.git' --exclude 'storage' --exclude 'logs' -e "ssh -i ~/.ssh/id_rsa" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/temp-backend/

      - name: Build, Migrate and Restart on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -x

            # 1. 正式なバックエンドディレクトリへファイルを反映（storageやlogsは一切触らせない）
            sudo rsync -a --delete --exclude 'storage' --exclude 'logs' /home/ubuntu/temp-backend/ /opt/package-forest/app/backend/

            # 2. 所有者を package-forest に変更
            sudo chown -R package-forest:package-forest /opt/package-forest/app/backend/

            # 3. 念のためストレージのシンボリックリンクが切れていないか再確認・貼直し
            sudo -u package-forest ln -sfn /var/lib/package-forest/storage /opt/package-forest/app/backend/storage

            # 4. package-forest ユーザーで Go のビルドを実行 (VCSエラー回避のため -buildvcs=false を追加)
            sudo -u package-forest bash -lc 'cd /opt/package-forest/app/backend && /usr/local/go/bin/go build -id -buildvcs=false -o package-forest-backend . && /usr/local/go/bin/go build -buildvcs=false -o package-forest-migrate ./cmd/migrate'

            # 5. マイグレーションの実行
            sudo -u package-forest bash -lc 'set -a; source /etc/package-forest/backend.env; set +a; /opt/package-forest/app/backend/package-forest-migrate up'

            # 6. アプリケーションの再起動
            sudo systemctl restart package-forest-backend

            echo "Backend successfully deployed, built, migrated, and restarted!"
          EOF
