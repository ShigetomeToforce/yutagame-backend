name: Deploy to Production EC2

on:
  push:
    branches:
      - main # または master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # サーバーのGoバージョンに合わせて調整

      - name: Build Go Backend Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o package-forest-backend main.go

      - name: Set up SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to EC2 via rsync & SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # 既知のホストに追加してSSH接続エラーを防ぐ
          mkdir -p ~/.ssh
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          # 1. バイナリをEC2へ転送 (-i オプションで明示的に秘密鍵を指定)
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" ./package-forest-backend $EC2_USER@$EC2_HOST:/opt/package-forest/app/backend/

          # 2. EC2側で権限の調整とサービスの再起動をリモート実行
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            sudo chown package-forest:package-forest /opt/package-forest/app/backend/package-forest-backend
            sudo chmod +x /opt/package-forest/app/backend/package-forest-backend
            sudo systemctl restart package-forest-backend
            echo "Successfully deployed and restarted package-forest-backend!"
          EOF
