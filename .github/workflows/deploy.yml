name: Deploy to Production EC2

on:
  push:
    branches:
      - main # または master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # サーバーのGoバージョンに合わせて調整

      - name: Build Go Backend Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o package-forest-backend main.go

      - name: Set up SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to EC2 via rsync & SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -x

          # 既知のホストに追加
          mkdir -p ~/.ssh
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts

          # 1. 一旦 ubuntu ユーザーが書き込めるホームディレクトリの temp フォルダへ転送
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST "mkdir -p /home/ubuntu/temp-build"
          rsync -avz -e "ssh -i ~/.ssh/id_rsa" ./package-forest-backend $EC2_USER@$EC2_HOST:/home/ubuntu/temp-build/

          # 2. EC2側で sudo を使って正式なアプリディレクトリへの移動、マイグレーション、サービス再起動を行う
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
            # 正式なディレクトリへバイナリを移動
            sudo mv /home/ubuntu/temp-build/package-forest-backend /opt/package-forest/app/backend/package-forest-backend

            # 権限の調整
            sudo chown package-forest:package-forest /opt/package-forest/app/backend/package-forest-backend
            sudo chmod +x /opt/package-forest/app/backend/package-forest-backend

            # 3. マイグレーションの実行 (package-forest ユーザーで環境変数を読み込んで実行)
            sudo -u package-forest bash -lc 'set -a; source /etc/package-forest/backend.env; set +a; /opt/package-forest/app/backend/package-forest-migrate up'

            # 4. アプリケーションの再起動
            sudo systemctl restart package-forest-backend
            echo "Successfully deployed, migrated, and restarted package-forest-backend!"
          EOF
