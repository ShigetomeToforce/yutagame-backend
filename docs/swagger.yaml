basePath: /api
definitions:
  admin.AdminSaveRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        description: 更新処理時、空文字の場合は「変更なし」として取り扱われます
        type: string
      roleType:
        type: string
    type: object
  admin.GameSaveRequest:
    properties:
      catchCopy:
        type: string
      code:
        type: string
      genreId:
        type: integer
      isClear:
        type: boolean
      isFavourite:
        type: boolean
      isPlay:
        type: boolean
      kana:
        type: string
      keywordIds:
        description: "\U0001F4A1 紐付けるキーワードのID配列"
        items:
          type: integer
        type: array
      listPrice:
        type: integer
      machineId:
        type: integer
      manufacturerId:
        type: integer
      name:
        type: string
      officialSiteUrl:
        type: string
      overview:
        type: string
      releaseDate:
        description: フロントからは文字列("YYYY-MM-DD")で受け取る
        type: string
      subCatch:
        type: string
      subGenre:
        type: string
      youtubeUrl:
        type: string
    type: object
  admin.GenreSaveRequest:
    properties:
      code:
        type: string
      kana:
        type: string
      name:
        type: string
      overview:
        type: string
    type: object
  admin.KeywordSaveRequest:
    properties:
      code:
        type: string
      kana:
        type: string
      keywordType:
        type: string
      name:
        type: string
      overview:
        type: string
      sortOrder:
        type: integer
    type: object
  admin.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  admin.MachineSaveRequest:
    properties:
      abbreviation:
        type: string
      code:
        type: string
      kana:
        type: string
      machineType:
        type: string
      manufacturerId:
        type: integer
      name:
        type: string
      overview:
        type: string
      releaseDate:
        description: フロントからは文字列("YYYY-MM-DD")で受け取る
        type: string
      sortOrder:
        type: integer
    type: object
  admin.ManufacturerSaveRequest:
    properties:
      code:
        type: string
      kana:
        type: string
      name:
        type: string
      overview:
        type: string
    type: object
  admin.UserSaveRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        description: 更新処理時、空文字の場合は「変更なし」として取り扱われます
        type: string
    type: object
  app.CatalogItem:
    properties:
      code:
        type: string
      gameCount:
        type: integer
      imageKey:
        type: string
      name:
        type: string
    type: object
  app.ContactRequest:
    properties:
      email:
        type: string
      message:
        type: string
      name:
        type: string
      subject:
        type: string
    type: object
  app.FavoriteRankingItem:
    properties:
      count:
        type: integer
      game:
        $ref: '#/definitions/model.Game'
    type: object
  app.GameFavoriteRequest:
    properties:
      visitorId:
        type: string
    type: object
  app.GameFavoriteResult:
    properties:
      alreadyVoted:
        type: boolean
      count:
        type: integer
      favoriteDate:
        type: string
      gameId:
        type: integer
    type: object
  app.GameRecommendationRequest:
    properties:
      gameName:
        type: string
      reason:
        type: string
    type: object
  app.KeywordItem:
    properties:
      code:
        type: string
      gameCount:
        type: integer
      name:
        type: string
    type: object
  app.PageViewRequest:
    properties:
      pagePath:
        type: string
      visitorId:
        type: string
    type: object
  app.PaginatedGameResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  app.PublicRankingResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      limit:
        type: integer
      page:
        type: integer
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  app.SiteStats:
    properties:
      gameCount:
        type: integer
      totalListPrice:
        type: integer
    type: object
  app.SitemapData:
    properties:
      announcementIds:
        items:
          type: integer
        type: array
      featureCodes:
        items:
          type: string
        type: array
      gameCodes:
        items:
          type: string
        type: array
    type: object
  app.TopContents:
    properties:
      favoriteRanking:
        items:
          $ref: '#/definitions/app.FavoriteRankingItem'
        type: array
      randomPicks:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      rankingTop20:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      recentlyReleased:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      recentlyUpdated:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      releaseToday:
        items:
          $ref: '#/definitions/model.Game'
        type: array
    type: object
  handler.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  handler.PaginatedResponse-model_Admin:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Admin'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_Game:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Game'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_Genre:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Genre'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_Keyword:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Keyword'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_Machine:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Machine'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_Manufacturer:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.Manufacturer'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  handler.PaginatedResponse-model_User:
    properties:
      data:
        description: admins や items などのキー名に依存しないよう、汎用的に "data" とします
        items:
          $ref: '#/definitions/model.User'
        type: array
      totalCount:
        type: integer
      totalPages:
        type: integer
    type: object
  model.Admin:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      roleType:
        type: string
      updatedAt:
        type: string
    type: object
  model.Announcement:
    properties:
      accessCount:
        type: integer
      bodyHtml:
        type: string
      createdAt:
        type: string
      displayOrder:
        description: DisplayOrder は公開中のお知らせ同士の表示優先度（1以上が手動指定、0は未指定）
        type: integer
      excerpt:
        type: string
      id:
        type: integer
      publishEndAt:
        type: string
      publishStartAt:
        type: string
      publishedAt:
        type: string
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.Banner:
    properties:
      accessCount:
        type: integer
      clickCount:
        type: integer
      createdAt:
        type: string
      displayOrder:
        type: integer
      endsAt:
        type: string
      id:
        type: integer
      imageKey:
        type: string
      linkUrl:
        type: string
      openInNewTab:
        type: boolean
      placement:
        type: string
      startsAt:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.ContactInquiry:
    properties:
      adminNote:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      message:
        type: string
      name:
        type: string
      status:
        type: string
      subject:
        type: string
      updatedAt:
        type: string
    type: object
  model.Feature:
    properties:
      accessCount:
        type: integer
      bodyHtml:
        type: string
      code:
        type: string
      createdAt:
        type: string
      displayOrder:
        type: integer
      excerpt:
        type: string
      featureGames:
        items:
          $ref: '#/definitions/model.FeatureGame'
        type: array
      games:
        items:
          $ref: '#/definitions/model.Game'
        type: array
      id:
        type: integer
      publishEndAt:
        type: string
      publishStartAt:
        type: string
      publishedAt:
        type: string
      status:
        type: string
      thumbnailImageKey:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.FeatureGame:
    properties:
      createdAt:
        type: string
      displayOrder:
        type: integer
      featureId:
        type: integer
      game:
        $ref: '#/definitions/model.Game'
      gameId:
        type: integer
      id:
        type: integer
      updatedAt:
        type: string
    type: object
  model.Game:
    properties:
      affiliates:
        items:
          $ref: '#/definitions/model.GameAffiliate'
        type: array
      catchCopy:
        type: string
      code:
        type: string
      createdAt:
        type: string
      genre:
        $ref: '#/definitions/model.Genre'
      genreId:
        type: integer
      id:
        type: integer
      imageKey:
        type: string
      isClear:
        type: boolean
      isFavourite:
        type: boolean
      isPlay:
        type: boolean
      kana:
        type: string
      keywords:
        description: "\U0001F4A1 凄まじいポイント：GORMに「game_keywordsという中間テーブルを使って、紐づくKeywordsを全自動でガッチャンコしてね」と1行で命令します"
        items:
          $ref: '#/definitions/model.Keyword'
        type: array
      listPrice:
        type: integer
      machine:
        $ref: '#/definitions/model.Machine'
      machineId:
        type: integer
      manufacturer:
        allOf:
        - $ref: '#/definitions/model.Manufacturer'
        description: "\U0001F4A1 依存関係の解消：GORMの1対多（Belongs To）リレーション群"
      manufacturerId:
        type: integer
      name:
        type: string
      officialSiteUrl:
        type: string
      overview:
        type: string
      previousRank:
        type: integer
      rank:
        type: integer
      rankingCount:
        type: integer
      releaseDate:
        type: string
      subCatch:
        type: string
      subGenre:
        type: string
      updatedAt:
        type: string
      youtubeUrl:
        type: string
    type: object
  model.GameAffiliate:
    properties:
      category:
        type: string
      createdAt:
        type: string
      gameId:
        type: integer
      id:
        type: integer
      updatedAt:
        type: string
      url:
        type: string
    type: object
  model.GameRecommendation:
    properties:
      adminNote:
        type: string
      createdAt:
        type: string
      gameName:
        type: string
      id:
        type: integer
      reason:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  model.Genre:
    properties:
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      imageKey:
        type: string
      kana:
        type: string
      name:
        type: string
      overview:
        type: string
      updatedAt:
        type: string
    type: object
  model.Keyword:
    properties:
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      kana:
        type: string
      keywordType:
        type: string
      name:
        type: string
      overview:
        type: string
      sortOrder:
        type: integer
      updatedAt:
        type: string
    type: object
  model.Machine:
    properties:
      abbreviation:
        type: string
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      imageKey:
        type: string
      kana:
        type: string
      machineType:
        type: string
      manufacturer:
        allOf:
        - $ref: '#/definitions/model.Manufacturer'
        description: "\U0001F4A1 依存関係の解消：GORMに「メーカー情報も連動してね」と教えるリレーション定義"
      manufacturerId:
        type: integer
      name:
        type: string
      overview:
        type: string
      releaseDate:
        type: string
      sortOrder:
        type: integer
      updatedAt:
        type: string
    type: object
  model.Manufacturer:
    properties:
      code:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      imageKey:
        type: string
      kana:
        type: string
      name:
        type: string
      overview:
        type: string
      updatedAt:
        type: string
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 所持ゲーム管理システムのバックエンドAPI仕様書
  title: Yutagame Backend API
  version: "1.0"
paths:
  /admin/admins:
    get:
      description: 条件に従いAdminユーザー情報の一覧を取得します。
      parameters:
      - description: ページ番号 (指定するとページングモード)
        in: query
        name: page
        type: integer
      - description: 表示件数 (10, 30, 50)
        in: query
        name: limit
        type: integer
      - description: 自由入力のテキスト検索（Adminユーザー名）
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: page指定時
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-model_Admin'
      security:
      - BearerAuth: []
      summary: Adminユーザー一覧取得
      tags:
      - Admins
    post:
      consumes:
      - application/json
      description: 新しいAdminユーザーフアカウントを作成します。
      parameters:
      - description: Adminユーザー登録情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AdminSaveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Admin'
        "400":
          description: バリデーション・重複エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adminユーザー新規登録
      tags:
      - Admins
  /admin/admins/{id}:
    delete:
      description: 指定されたIDのAdminユーザーアカウントを削除します。
      parameters:
      - description: AdminユーザーID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adminユーザー削除
      tags:
      - Admins
    get:
      description: 指定されたIDのAdminユーザー情報を取得します。
      parameters:
      - description: AdminユーザーID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Admin'
        "404":
          description: 未検出エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adminユーザー詳細取得
      tags:
      - Admins
    put:
      consumes:
      - application/json
      description: 指定されたIDのAdminユーザーの名前、メール、パスワード、権限を更新します。
      parameters:
      - description: AdminユーザーID
        in: path
        name: id
        required: true
        type: integer
      - description: Adminユーザー更新情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.AdminSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Admin'
        "400":
          description: エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Adminユーザー情報更新
      tags:
      - Admins
  /admin/games:
    get:
      description: 条件に従いゲーム情報の一覧を取得します。
      parameters:
      - description: ページ番号 (指定するとページングモード)
        in: query
        name: page
        type: integer
      - description: 表示件数 (10, 30, 50)
        in: query
        name: limit
        type: integer
      - description: 自由入力のテキスト検索（ゲーム名）
        in: query
        name: q
        type: string
      - collectionFormat: csv
        description: メーカーIDの複数指定
        in: query
        items:
          type: integer
        name: manufacturerIDs
        type: array
      - collectionFormat: csv
        description: 機種IDの複数指定
        in: query
        items:
          type: integer
        name: machineIDs
        type: array
      - collectionFormat: csv
        description: ジャンルIDの複数指定
        in: query
        items:
          type: integer
        name: genreIDs
        type: array
      - collectionFormat: csv
        description: キーワードIDの複数指定
        in: query
        items:
          type: integer
        name: keywordIDs
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: page指定時
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-model_Game'
      security:
      - BearerAuth: []
      summary: ゲーム一覧取得
      tags:
      - Games
    post:
      consumes:
      - application/json
      description: 新しいゲームの情報をデータベースに登録します。
      parameters:
      - description: ゲーム登録情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.GameSaveRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Game'
      security:
      - BearerAuth: []
      summary: ゲーム新規登録
      tags:
      - Games
  /admin/games/{id}:
    delete:
      description: 指定されたIDのゲーム情報を削除します。
      parameters:
      - description: ゲームID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ゲーム情報削除
      tags:
      - Games
    get:
      description: 指定されたIDまたはコードのゲーム詳細情報を取得します。
      parameters:
      - description: ゲームIDまたはゲームコード
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "404":
          description: 未検出エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ゲーム詳細取得
      tags:
      - Games
    put:
      consumes:
      - application/json
      description: 指定されたIDのゲーム情報更新します。
      parameters:
      - description: ゲームID
        in: path
        name: id
        required: true
        type: integer
      - description: ゲーム更新情報
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.GameSaveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "400":
          description: エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ゲーム情報更新
      tags:
      - Games
  /admin/games/code/{code}:
    get:
      description: 指定されたコードのゲーム詳細情報を取得します。
      parameters:
      - description: ゲームコード
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Game'
        "404":
          description: 未検出エラー
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ゲーム詳細取得（コード指定）
      tags:
      - Games
  /admin/genres:
    get:
      parameters:
      - description: ページ番号 (指定するとページングモード)
        in: query
        name: page
        type: integer
      - description: 表示件数 (10, 30, 50)
        in: query
        name: limit
        type: integer
      - description: 検索キーワード (名前またはカナの部分一致)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: page指定時
          schema:
